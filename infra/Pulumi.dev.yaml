config:
  aws:region: sa-east-1
  mvp-fiscal-infra:environment: dev
  mvp-fiscal-infra:projectName: fiscal-mvp
  mvp-fiscal-infra:network:
    vpcCidr: 10.40.0.0/16
    availabilityZones:
      - sa-east-1a
      - sa-east-1b
    enableNatGateway: true
    publicSubnetCidrs:
      - 10.40.0.0/24
      - 10.40.1.0/24
    privateAppSubnetCidrs:
      - 10.40.10.0/24
      - 10.40.11.0/24
    privateDbSubnetCidrs:
      - 10.40.20.0/24
      - 10.40.21.0/24
  mvp-fiscal-infra:database:
    dbName: fiscal
    username: fiscal
    instanceClass: db.t4g.micro
    allocatedStorage: 20
    maxAllocatedStorage: 100
    multiAz: false
    backupRetentionDays: 7
    deletionProtection: false
  mvp-fiscal-infra:app:
    erpWebhookUrl: https://erp.dev.example.com/fiscal/webhook
    fiscalProvider: webmania
    defaultWorkspaceId: ws_demo_a
    pendingStaleSeconds: 120
    processingStaleSeconds: 120
    presignMode: url
    presignTtlSeconds: 60
    reconcileEveryMinutes: 5
  mvp-fiscal-infra:features:
    enableBastion: false
    enableSupportTable: false
    enableLambdaFunctions: false
