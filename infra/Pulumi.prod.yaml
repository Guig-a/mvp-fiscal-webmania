config:
  aws:region: sa-east-1
  mvp-fiscal-infra:environment: prod
  mvp-fiscal-infra:projectName: fiscal-mvp
  mvp-fiscal-infra:network:
    vpcCidr: 10.60.0.0/16
    availabilityZones:
      - sa-east-1a
      - sa-east-1b
    enableNatGateway: true
    publicSubnetCidrs:
      - 10.60.0.0/24
      - 10.60.1.0/24
    privateAppSubnetCidrs:
      - 10.60.10.0/24
      - 10.60.11.0/24
    privateDbSubnetCidrs:
      - 10.60.20.0/24
      - 10.60.21.0/24
  mvp-fiscal-infra:database:
    dbName: fiscal
    username: fiscal
    instanceClass: db.t4g.medium
    allocatedStorage: 100
    maxAllocatedStorage: 500
    multiAz: true
    backupRetentionDays: 30
    deletionProtection: true
  mvp-fiscal-infra:app:
    erpWebhookUrl: https://erp.example.com/fiscal/webhook
    fiscalProvider: webmania
    defaultWorkspaceId: ws_demo_a
    pendingStaleSeconds: 300
    processingStaleSeconds: 300
    presignMode: url
    presignTtlSeconds: 60
    reconcileEveryMinutes: 5
  mvp-fiscal-infra:features:
    enableBastion: false
    enableSupportTable: false
    enableLambdaFunctions: false
